name: CD - Docker & Release

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  deploy-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Obrigatório para o github-tag-action e release-action
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Bump da Versão e Criação da Tag (Gera a tag global para o repositório)
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: "main"
          default_bump: false

      # 2. Login no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build e Push do BACKEND (Executa apenas se houver mudanças na pasta backend ou se for forçado)
      - name: Build e Push da Imagem Docker (Backend)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            pereirafabio/calazans-automec-backend:latest
            pereirafabio/calazans-automec-backend:${{ steps.tag_version.outputs.new_tag }}

      # 4. Build e Push do FRONTEND (Ajuste o caminho da pasta se necessário, ex: ./frontend)
      - name: Build e Push da Imagem Docker (Frontend)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            pereirafabio/calazans-automec-frontend:latest
            pereirafabio/calazans-automec-frontend:${{ steps.tag_version.outputs.new_tag }}

      # 5. Criar a Release no GitHub
      - name: Create a GitHub release
        if: ${{ steps.tag_version.outputs.new_tag != '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          prerelease: ${{ steps.tag_version.outputs.prerelease == 'true' }}
